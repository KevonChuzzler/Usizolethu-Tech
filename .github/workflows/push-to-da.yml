name: Build and Deploy to HOSTAFRICA DirectAdmin

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure SSH for DirectAdmin
        env:
          DA_SSH_KEY: ${{ secrets.DA_SSH_KEY }}
        run: |
          if [ -z "$DA_SSH_KEY" ]; then
            echo "Error: DA_SSH_KEY repository secret is not set." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DA_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H da33.host-ww.net >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push dist build to DirectAdmin Git remote
        run: |
          cd dist
          git init
          git checkout -B main
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy build ${{ github.sha }}"
          git remote add directadmin usizole1@da33.host-ww.net:domains/usizolethu.co.za/usizolethu-tech.git
          git push -f directadmin main:main
